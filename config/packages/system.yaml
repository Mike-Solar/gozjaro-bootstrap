# Gozjaro System Packages
# Additional packages required for the final system beyond base LFS.

packages:
  - name: curl
    version: "8.23.0"
    category: system
    source:
      url: https://curl.se/download/curl-8.23.0.tar.xz
      checksum:
        type: sha256
        value: "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --with-openssl
        - --without-libpsl
        - --disable-static
        - --disable-ldap
        - --with-ca-path=/etc/ssl/certs
      install_check: curl --version
    dependencies:
      - openssl
      - zlib

  - name: dbus
    version: "1.16.2"
    category: system
    source:
      url: https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz
      checksum:
        type: sha256
        value: "0ba2a1a4b16afe7bceb2c07e9ce99a8c2c3508e5dec290dbb643384bd6beb7e2"
    build:
      system: meson
      install_check: dbus-daemon --version
    dependencies: []

  - name: eudev
    version: "3.2.14"
    category: system
    source:
      url: https://github.com/eudev-project/eudev/releases/download/v3.2.14/eudev-3.2.14.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --bindir=/bin
        - --sbindir=/sbin
        - --libexecdir=/usr/lib
        - --with-rootprefix=
        - --with-rootlibdir=/usr/lib
        - --disable-static
      install_check: udevadm --version
    dependencies: []

  - name: git
    version: "2.49.1"
    category: system
    source:
      url: https://www.kernel.org/pub/software/scm/git/git-2.49.1.tar.xz
      checksum:
        type: sha256
        value: "310831de967f1c8c5e8ff55f92807dea89f83dc3d3d2a5d16c209bd01a31def1"
    build:
      system: make
      configure:
        - prefix=/usr
        - CC=gcc
        - PERL_PATH=/usr/bin/perl
      install_check: git --version
    dependencies:
      - perl
      - openssl

  - name: grub
    version: "2.14"
    category: system
    source:
      url: https://ftpmirror.gnu.org/grub/grub-2.14.tar.xz
      checksum:
        type: sha256
        value: "bc8d3c73535b8838d8c8e2654d73edc4e6ae8c8acdb45d5df5dc9a1547446d43"
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --sysconfdir=/etc
        - --disable-grub-mkfont
        - --disable-werror
      install_check: grub-install --version
    dependencies: []

  - name: kmod
    version: "34.2"
    category: system
    source:
      url: https://www.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --sysconfdir=/etc
        - --with-openssl
        - --with-xz
        - --with-zstd
        - --with-zlib
        - --disable-manpages
      install_check: lsmod --version
    dependencies:
      - openssl

  - name: nano
    version: "8.3"
    category: system
    source:
      url: https://www.nano-editor.org/dist/v8/nano-8.3.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --enable-color
        - --enable-nanorc
      install_check: nano --version
    dependencies: []

  - name: openssh
    version: "10.4p1"
    category: system
    source:
      url: https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.4p1.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --sysconfdir=/etc/ssh
        - --with-privsep-path=/run/sshd
        - --with-ssl-dir=/usr
      install_check: ssh -V
    dependencies:
      - openssl

  - name: rsync
    version: "3.4.1"
    category: system
    source:
      url: https://download.samba.org/pub/rsync/src/rsync-3.4.1.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
      install_check: rsync --version
    dependencies: []

  - name: systemd
    version: "261.2"
    category: system
    source:
      # LFS-style GitHub archive with a custom filename so the on-disk basename
      # is "systemd-261.2.tar.gz" (the stage-60 glob 'systemd-*.tar.*' needs
      # this prefix; the default refs/tags/vX download lands as "v261.2.tar.gz").
      url: https://github.com/systemd/systemd/archive/v261.2/systemd-261.2.tar.gz
      checksum:
        type: md5
        value: "e3f04ccc83a28ec5e80c5432bb8329f5"
    build:
      system: meson
      install_check: systemctl --version
    dependencies:
      - bzip2
      - e2fsprogs
      - libcap
      - libffi
      - libpipeline
      - ncurses
      - openssl
      - pcre2
      - xz
      - zstd

  - name: wget
    version: "1.25.0"
    category: system
    source:
      url: https://ftp.gnu.org/gnu/wget/wget-1.25.0.tar.gz
      checksum:
        type: sha256
        value: "766e48423e79359ea31e41db9e5c289675947a7fcf2efdcedb726ac9d0da3784"
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --with-openssl
      install_check: wget --version
    dependencies:
      - openssl

  - name: vim
    version: "9.2.0954"
    category: system
    source:
      # LFS-style GitHub archive with a custom filename so the on-disk basename
      # is "vim-9.2.0954.tar.gz" (the stage-60 glob 'vim-*.tar.*' needs this
      # prefix; the default refs/tags/vX download lands as "v9.2.0954.tar.gz").
      url: https://github.com/vim/vim/archive/v9.2.0954/vim-9.2.0954.tar.gz
      checksum:
        type: sha256
        value: "d1874a84864a8e3419fe8fb0cce5666ba4b388eed51b1fc24739cff7dd732c6e"
    build:
      system: autotools
      configure:
        - --prefix=/usr
      install_check: vim --version
    dependencies: []

  - name: sysvinit
    version: "3.14"
    category: system
    source:
      url: https://github.com/slicer69/sysvinit/releases/download/3.14/sysvinit-3.14.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: make
      install_check: telinit --version
    dependencies: []

  - name: sysklogd
    version: "2.7.2"
    category: system
    source:
      url: https://github.com/troglobit/sysklogd/releases/download/v2.7.2/sysklogd-2.7.2.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
      install_check: syslogd -V
    dependencies: []

  - name: perl
    version: "5.44.0"
    category: system
    source:
      url: https://www.cpan.org/src/5.0/perl-5.44.0.tar.xz
      checksum:
        type: sha256
        value: ""
    build:
      system: custom
      install_check: perl --version
    dependencies: []

  - name: python3
    version: "3.14.7"
    category: system
    source:
      url: https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz
      checksum:
        type: sha256
        value: "3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81"
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --enable-shared
        - --with-system-expat
        - --enable-optimizations
      install_check: python3 --version
    dependencies: []

  - name: openssl
    version: "4.0.1"
    category: system
    source:
      url: https://github.com/openssl/openssl/releases/download/openssl-4.0.1/openssl-4.0.1.tar.gz
      checksum:
        type: sha256
        value: "2db3f3a0d6ea4b59e1f094ace2c8cd536dffb87cdc39084c5afa1e6f7f37dd09"
    build:
      system: custom
      configure:
        - ./config
        - --prefix=/usr
        - --openssldir=/etc/ssl
        - --libdir=lib
        - shared
        - zlib-dynamic
      install_check: openssl version
    dependencies: []

  - name: jinja2
    version: "3.1.6"
    category: system
    source:
      url: https://files.pythonhosted.org/packages/source/j/jinja2/jinja2-3.1.6.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: python
      install_check: python3 -c "import jinja2"
    dependencies:
      - python3
      - markupsafe

  - name: setuptools
    version: "84.0.0"
    category: system
    source:
      url: https://pypi.org/packages/source/s/setuptools/setuptools-84.0.0.tar.gz
      checksum:
        type: sha256
        value: "f4695c21257f0d9b537ec2692c941d02ee143b7cc1276941349a546573b2ef73"
    build:
      system: python
      install_check: python3 -c "import setuptools"
    dependencies:
      - python3

  # Runtime dependency of wheel 0.48 (packaging >= 24.0). Zero runtime deps
  # itself; build backend is flit_core (>=3.12, we build 4.0.2). LFS 13.1
  # ships it for exactly this chain: build it, pip-install it, and the
  # offline `pip3 install --no-index wheel` can resolve its requirement.
  - name: packaging
    version: "26.3"
    category: system
    source:
      url: https://files.pythonhosted.org/packages/source/p/packaging/packaging-26.3.tar.gz
      checksum:
        type: sha256
        value: "94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79"
    build:
      system: python
      install_check: python3 -c "import packaging"
    dependencies:
      - python3
      - flit-core

  - name: wheel
    version: "0.48.0"
    category: system
    source:
      url: https://pypi.org/packages/source/w/wheel/wheel-0.48.0.tar.gz
      checksum:
        type: sha256
        value: "94800765601e9171bf5d58d066e640662842bcedcbab982b2c90787a2c987322"
    build:
      system: python
      install_check: python3 -c "import wheel"
    dependencies:
      - python3
      - packaging

  - name: markupsafe
    version: "3.0.3"
    category: system
    source:
      url: https://files.pythonhosted.org/packages/source/m/markupsafe/markupsafe-3.0.3.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: python
      install_check: python3 -c "import markupsafe"
    dependencies:
      - python3

  - name: xml-parser
    version: "2.47"
    category: system
    source:
      url: https://www.cpan.org/authors/id/T/TO/TODDR/XML-Parser-2.47.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: python
      install_check: python3 -c "import XML::Parser"
    dependencies:
      - perl

  - name: tcl
    version: "8.6.18"
    category: system
    source:
      url: https://distfiles.macports.org/tcl/tcl8.6.18-src.tar.gz
      checksum:
        type: sha256
        value: ""
    build:
      system: autotools
      configure:
        - --prefix=/usr
        - --mandir=/usr/share/man
        - --disable-rpath
      install_check: tclsh --version
    dependencies: []

  - name: flit-core
    version: "4.0.2"
    category: system
    source:
      url: https://pypi.org/packages/source/f/flit-core/flit_core-4.0.2.tar.gz
      checksum:
        type: sha256
        value: "b6929defd93884b584d7c87829e0e7b5c26ed6be17b0b873979019314aa841c8"
    build:
      system: python
      install_check: python3 -m flit_core.wheel
    dependencies:
      - python3