        strip: 0
    build:
      system: make
      install_check: bzip2 --version
    dependencies: []


  - name: cpio
    version: "2.15"
    category: base
    source:
      # Final release of GNU cpio (Jan 2024); tarball ships a pre-generated
      # configure. The chicken-and-egg piece of the bootstrap: 85-initramfs
      # packs the initramfs with in-chroot cpio instead of handing the
      # staging tree to the host.
      url: https://ftp.gnu.org/gnu/cpio/cpio-2.15.tar.gz
      checksum:
        type: sha256
        value: "efa50ef983137eefc0a02fdb51509d624b5e3295c980aa127ceee4183455499e"
    build:
      system: autotools
      # cpio 2.15 ships a pre-generated configure — no autoreconf, so the
      # AM_GNU_GETTEXT macros never need external gettext.m4. NLS off is
      # the LFS convention (no standalone libiconv in the tree).
      configure:
        - --prefix=/usr
        - --disable-nls
      install_check: cpio --version
    dependencies: []

