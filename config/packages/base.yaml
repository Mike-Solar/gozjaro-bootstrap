      # *git snapshot* (configure.ac only, no generated configure) and breaks
      # the cross stage 40 build with "../configure: No such file". The md5
      # is the one from the LFS md5sums page for file-5.48.tar.gz.
      url: https://astron.com/pub/file/file-5.48.tar.gz
      checksum:
        type: md5
        value: "423686e97f731d8c24e9cd1a22b03dec"
    build:
